[package]
name = "jujo"
version = "1.0.0"
edition = "2024"
description = "Agent-first code generation framework"
repository = "https://github.com/JYC11/jujo"
license = "MIT"
keywords = ["codegen", "template", "scaffolding", "cli", "agent"]
categories = ["command-line-utilities", "development-tools", "template-engine"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
anyhow = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
heck = "0.5"
inquire = "0.7"
owo-colors = "4"
pluralizer = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tera = "1"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["json"] }
predicates = "3"
tempfile = "3"
