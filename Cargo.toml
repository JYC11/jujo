[package]
name = "jujo"
version = "0.1.0"
edition = "2024"
description = "Agent-first code generation framework"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
heck = "0.5"
pluralizer = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tera = "1"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["json"] }
predicates = "3"
tempfile = "3"
